<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
  </head>
  <body>
  <a href="/?sort=title">Sort By Title</a><br>
  <a href="/?sort=author">Sort By Author</a><br>
  <a href="/?sort=id">Sort By ID</a>
  <br><br>
  <form action="/" method="GET">
    <input type="text" name="search" placeholder="Search by title">
    <button type="submit">Search</button></form><br>
{% if not books %}
  <p>Sorry no books with your search parameter "{{ search }}" found.</p>
{% endif %}
  {% if message %}
  <p>{{ message }}</p>
  {% endif %}
{% for book in books %}
<div>
  ----
  <h2>ID {{book.id}} : "{{ book.title }}" by: {{ book.author.name }}</h2>
   <form action="/book/{{book.id}}/delete" method="POST">
    <button type="submit">Delete Book</button>
  </form>

</div>
{% endfor %}

</body>
</html>
